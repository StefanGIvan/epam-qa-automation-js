name: CI

on:
    push:
        branches:
            - main
            - module-10-quality-gates
    pull_request:
        branches:
            - main

jobs:
    quality-checks:
        name: Code quality checks
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install root dependencies
              run: npm ci

            - name: Run Prettier
              run: npm run lint:prettier

            - name: Run ESLint
              run: npm run lint:eslint

    api-tests:
        name: API tests
        runs-on: ubuntu-latest
        needs: quality-checks

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install API dependencies
              working-directory: module-6-api-tests
              run: npm install

            - name: Run API tests
              working-directory: module-6-api-tests
              run: npm test

    playwright-tests:
        name: Playwright tests
        runs-on: ubuntu-latest
        needs: quality-checks

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install Cucumber UI dependencies
              working-directory: module-12-bdd-cucumber
              run: npm ci

            - name: Install Cucumber UI browser
              working-directory: module-12-bdd-cucumber
              run: npx playwright install --with-deps chromium

            - name: Set up Docker QEMU
              uses: docker/setup-qemu-action@v3

            - name: Start Practice Software Testing app
              working-directory: module-12-bdd-cucumber
              run: docker compose up -d

            - name: Show Docker containers
              working-directory: module-12-bdd-cucumber
              run: docker compose ps

            - name: Show Docker logs
              working-directory: module-12-bdd-cucumber
              run: docker compose logs --tail=100

            - name: Wait for Practice Software Testing app
              run: |
                  for i in {1..30}; do
                      if curl -s http://localhost:8091 > /dev/null; then
                          echo "Practice Software Testing app is ready"
                          exit 0
                      fi
                      echo "Waiting for app..."
                      sleep 5
                  done
                  echo "App did not become ready in time"
                  exit 1

            - name: Seed Practice Software Testing database
              working-directory: module-12-bdd-cucumber
              run: docker compose exec -T laravel-api php artisan migrate:fresh --seed

            - name: Run Cucumber UI tests
              working-directory: module-12-bdd-cucumber
              env:
                  BASE_URL: http://localhost:4200
              run: npm run test:cucumber:ui

            - name: Stop Practice Software Testing app
              if: always()
              working-directory: module-12-bdd-cucumber
              run: docker compose down -v

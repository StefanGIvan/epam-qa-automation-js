services:
    laravel-api:
        image: testsmith/practice-software-testing-sprint5-api
        environment:
            PHP_OPCACHE_VALIDATE_TIMESTAMPS: 1
            DB_PORT: 3306
            DB_HOST: mariadb
            host: localhost
            DISABLE_LOGGING: true
        volumes:
            - laravel-app-code:/var/www
        depends_on:
            - mariadb

    angular-ui:
        image: testsmith/practice-software-testing-sprint5-ui
        ports:
            - '4200:4200'
        command: >
            bash -c "ng serve --host 0.0.0.0 --port 4200"

    web:
        image: testsmith/practice-software-testing-web
        ports:
            - '8091:80'
            - '8000:81'
        depends_on:
            - laravel-api
        volumes:
            - laravel-app-code:/var/www

    cron:
        image: testsmith/practice-software-testing-cron
        restart: always
        depends_on:
            - mariadb
            - laravel-api
        volumes:
            - laravel-app-code:/var/www
        working_dir: /var/www
        command: sh -c "crond -f -l 8"
        environment:
            PHP_OPCACHE_VALIDATE_TIMESTAMPS: 1
            DB_PORT: 3306
            DB_HOST: mariadb
            host: localhost
            DISABLE_LOGGING: true

    mariadb:
        image: yobasystems/alpine-mariadb:10.6.11
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_USER: user
            MYSQL_PASSWORD: root
            MYSQL_DATABASE: toolshop

    mailcatcher:
        image: dockage/mailcatcher:0.9.0
        ports:
            - '1025:1025'
            - '1080:1080'

volumes:
    laravel-app-code:
